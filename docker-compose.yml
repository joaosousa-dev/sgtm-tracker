services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SGTM_DOMAIN: ${SGTM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sgtm
      - sgtm-preview
      - tracker
  sgtm:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    restart: unless-stopped
    environment:
      CONTAINER_CONFIG: ${CONTAINER_CONFIG}
      PORT: "8080"
      PREVIEW_SERVER_URL: https://serverpreview.ojoaooliveira.com.br
    expose:
      - "8080"
  sgtm-preview:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    restart: unless-stopped
    environment:
      CONTAINER_CONFIG: ${CONTAINER_CONFIG}
      RUN_AS_PREVIEW_SERVER: "true"
      PORT: "8081"
    expose:
      - "8081"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy volatile-ttl --save 900 1
    volumes:
      - redis_data:/data
    expose:
      - "6379"
  tracker:
    build: ./tracker
    restart: unless-stopped
    environment:
      PIXEL_ID: ${PIXEL_ID}
      CAPI_TOKEN: ${CAPI_TOKEN}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    expose:
      - "3000"
volumes:
  caddy_data:
  caddy_config:
  redis_data:
